#!/usr/sbin/nft -f
# /etc/nftables.conf — Fenix OS: FAIL-CLOSED (iso_plan §B; boot_security §3.2; TODO M8)
#
# Zasada: jedyny proces mowiacy do internetu = uzytkownik `fenix` (uid 1088)
# i mowi WYLACZNIE naszym transportem (camo, M3). DNS i NTP poza camo = DROP.
# Wszystko inne = DROP. Zanim Fenix nie wstanie, z maszyny nie wychodzi NIC
# poza DHCP (adres zdobyc trzeba). Siec Fenixa = poczatkiem jedynie seed nodes
# z /etc/fenix/seeds.list — reszta sieci zbiorczej dolacza z czasem (M2, gossip).
#
# Uwaga: uid MUSI pasowac do useradd w hooku 0100 (build_iso.sh --selftest to sprawdza).

flush ruleset

table inet fenix {
    chain output {
        type filter hook output priority filter; policy drop;

        oifname "lo" accept comment "petla lokalna wolna"

        # DHCPv4: tylko root, tylko 67/68 (adres IP trzeba zdobyc, reszta cicho)
        meta skuid 0 udp dport {67, 68} accept comment "DHCPv4 klient"

        # Fenix (uid 1088): DNS i NTP otwartym tekstem zakazane — czas/DNS ida przez camo
        meta skuid 1088 udp dport {53, 123} counter drop comment "fail-closed: DNS/NTP udp poza camo"
        meta skuid 1088 tcp dport {53, 853} counter drop comment "fail-closed: DNS tcp/DoT poza camo"
        meta skuid 1088 accept comment "Fenix transport (camo) do seedow/peerow"

        # Mullvad/WireGuard (D29B, fenix-vpn): wg-quick nadaje zewnetrznym pakietom
        # tunelu fwmark 51820 (nie pchają się przez hook jako żaden uid = kernel);
        # bez tego ACCEPT base-table zadusioliby handshake WG; fenixwg (kill switch)
        # i tak ogranicza to do samego endpointu UDP.
        meta mark 51820 accept comment "WG outer (fenix-vpn): handshake/ruch tunelu"

        # nic wiecej nie wychodzi — rzadki log, drop
        limit rate 4/minute log prefix "fenix-out-drop: "
        counter drop comment "fail-closed default"
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept
        ct state { established, related } accept comment "tylko powroty naszych polaczen"
        limit rate 4/minute log prefix "fenix-in-drop: "
        counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        counter drop comment "nie jestesmy routerem"
    }
}
