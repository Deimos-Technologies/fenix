# /etc/tmpfiles.d/fenix.conf — FenixOS: katalog RAM na pliki sterujące (D27/M7b)
# /run/fenix żyje w tmpfs: vpn.env pisze GUI (user fenix), czyta fenix-vpn.service
# (ConditionPathExists). Grupa fenix musi mieć zapis — stąd 0770 root:fenix.
# Typ  ścieżka     tryb  użytkownik  grupa  wiek  argument
d     /run/fenix   0770  root        fenix  -     -
